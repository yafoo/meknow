<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meknow 系统安装</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .install-box { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 40px; width: 400px; max-width: 90%; }
        .install-box h1 { font-size: 24px; margin-bottom: 8px; color: #333; }
        .install-box p { color: #999; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; transition: border-color 0.2s; }
        .form-group input:focus { outline: none; border-color: #409eff; }
        .btn { width: 100%; padding: 12px; background: #409eff; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #66b1ff; }
        .btn:disabled { background: #a0cfff; cursor: not-allowed; }
        .msg { padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 14px; }
        .msg-error { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }
        .version { text-align: center; color: #ccc; font-size: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="install-box">
        <h1>🧠 Meknow</h1>
        <p>轻量级个人知识库系统 · v{{VERSION}}</p>
        
        <form method="post" action="/install/install">
            <div class="form-group">
                <label>管理员用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>管理员密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn">开始安装</button>
        </form>
        
        <div class="version">Meknow v{{VERSION}} · Powered by jj.js</div>
    </div>
</body>
</html>
